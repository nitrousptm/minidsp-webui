# triggerhappy actions for the miniDSP IR remote (see ../ir-remote.md).
# Install as /etc/triggerhappy/triggers.d/minidsp-remote.conf
#
# Column 2 is the event type: 1 = key press, 2 = auto-repeat while held.
# Single-press volume/mute is already handled by moOde's own media.conf;
# the two "2" lines only add repeat-while-held. Drop them if a single press
# ever steps twice on your install.
KEY_VOLUMEUP      2 /var/www/util/vol.sh -up 1
KEY_VOLUMEDOWN    2 /var/www/util/vol.sh -dn 1

KEY_PLAYPAUSE     1 mpc toggle
KEY_NEXTSONG      1 mpc next
KEY_PREVIOUSSONG  1 mpc prev

# Presets through the web UI backend so its stored state follows.
# /api/master switches the device preset (~3.6 s until the device reports
# it); /api/presets/N/activate additionally pushes the backend's stored
# config for that preset into the device (~6 s) - use that variant if
# anything else ever writes to the device. See ../ir-remote.md.
KEY_PROG1         1 curl -s -X POST -H content-type:application/json -d '{"preset":0}' http://127.0.0.1:5381/api/master
KEY_PROG2         1 curl -s -X POST -H content-type:application/json -d '{"preset":1}' http://127.0.0.1:5381/api/master
KEY_PROG3         1 curl -s -X POST -H content-type:application/json -d '{"preset":2}' http://127.0.0.1:5381/api/master
KEY_PROG4         1 curl -s -X POST -H content-type:application/json -d '{"preset":3}' http://127.0.0.1:5381/api/master

# Not assigned yet - uncomment and `systemctl restart triggerhappy`.
#KEY_STOP          1 mpc stop        # the remote's standby key
#KEY_SOUND         1 mpc toggle      # the remote's source key
#KEY_CONFIG        1 /usr/local/bin/preset-toggle.sh   # the remote's Dirac Live key
